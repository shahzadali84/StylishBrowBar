name: Update popular treatments

# Rewrites the "Popular treatments" list on the home page from real Acuity
# booking counts. Never prints or commits anything beyond service names,
# durations, prices and counts — see scripts/update_popular_treatments.py.

on:
  schedule:
    # Mondays at 13:00 UTC (roughly 8am US Eastern; cron is always UTC).
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch booking counts and update index.html
        env:
          ACUITY_USER_ID: ${{ secrets.ACUITY_USER_ID }}
          ACUITY_API_KEY: ${{ secrets.ACUITY_API_KEY }}
        run: python3 scripts/update_popular_treatments.py

      - name: Commit changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No change to index.html; nothing to commit."
          else
            git add index.html
            git commit -m "Update popular treatments from Acuity booking counts"
            git push
          fi
